[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nvplan"
version = "0.0.1"
description = "NewVision AI-supported planning PoC - deterministic planning engine with traceable derivations"
readme = "PLAN.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pydantic>=2.0",
]

[project.scripts]
nvplan-gen-data = "nvplan.data.generate:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["nvplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
