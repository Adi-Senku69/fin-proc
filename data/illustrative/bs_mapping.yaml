# Illustrative P&L -> Balance Sheet -> Cash Flow mapping
# ILLUSTRATIVE: generated dummy data, not Newvision figures.
# Generated by nvplan.data.generate (seed=42).
label: ILLUSTRATIVE
description: Illustrative P&L -> balance-sheet mapping until Newvision supplies its
  own. Cash flow = delta of balance-sheet movements.
units: kEUR
assumptions:
  dso_days: 45
  dpo_days: 30
  inventory_days: 30
  days_per_year: 365
  depreciation_years: 5
  tax_rate_ref: 'control_table.yaml: tax_rate'
pl:
  lines:
  - code: revenue
    source: REV
  - code: material
    source: MAT
  - code: external
    source: EXT
  - code: personnel
    source: PERS
  - code: other
    source: OTH
    note: incl. depreciation (DEPR component)
  - code: ebit
    formula: revenue - material - external - personnel - other
  - code: tax
    formula: max(ebit, 0) * tax_rate
  - code: net_income
    formula: ebit - tax
bs:
  assets:
  # NOTE (orchestrator, 2026-09-09): the engine does NOT use the balancing formula below for cash.
  # Cash is computed from the cash-flow statement (closing_cash = opening_cash + net_cash_flow) and the
  # balance-sheet identity is then CHECKED, not forced (nvplan/core/statements.py::check_consistency).
  # The balancing expression is kept only as documentation of the identity it must satisfy.
  - code: cash
    formula: 'balancing: total_liabilities_equity - receivables - inventory - fixed_assets'
  - code: receivables
    formula: revenue * dso_days / days_per_year
  - code: inventory
    formula: material * inventory_days / days_per_year
  - code: fixed_assets
    formula: prior_fixed_assets + capex - depreciation
  liabilities_equity:
  - code: payables
    formula: (material + external) * dpo_days / days_per_year
  - code: equity
    formula: prior_equity + net_income
  balance_check: cash + receivables + inventory + fixed_assets == payables + equity
cf:
  lines:
  - code: cf_operating
    formula: net_income + depreciation - delta(receivables) - delta(inventory) + delta(payables)
  - code: cf_investing
    formula: -capex
  - code: cf_financing
    formula: '0'
  - code: delta_cash
    formula: cf_operating + cf_investing + cf_financing
  tie_check: delta_cash == cash_t - cash_{t-1}
opening_balance_sheet:
  year: 2025
  note: End of last actual year; equity set so that the sheet balances at the chosen
    cash level.
  cash: 2500.0
  receivables: 2560.156
  inventory: 106.748
  fixed_assets: 951.18
  total_assets: 6118.084
  payables: 186.837
  equity: 5931.247
