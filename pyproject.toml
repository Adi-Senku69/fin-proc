[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nvplan"
version = "0.0.1"
description = "NewVision AI-supported planning PoC - deterministic planning engine with traceable derivations"
readme = "PLAN.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "deepagents>=0.7.13",
    "langchain-anthropic>=1.7.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn>=0.52.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
nvplan-gen-data = "nvplan.data.generate:main"
nvplan-demo = "nvplan.api.demo:main"
nvplan-serve = "nvplan.api.app:serve"
nvplan-ai-check = "nvplan.ai.check:main"
nvplan-bridge-check = "bridge.check:main"
nvplan-brain-write-check = "bridge.ingest_check:main"
nvplan-brain-draft-check = "bridge.draft_check:main"
nvplan-brain-sweep-check = "bridge.sweep_check:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["nvplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests hit the real Anthropic API (they cost money and need a credential). They are
# skipped without one, and `-m "not live"` is the default so a plain `uv run pytest` never
# calls out. Run them deliberately with: uv run pytest -m live
markers = [
    "live: makes a real Anthropic API call (needs a credential; run with -m live)",
]
addopts = "-m 'not live'"
